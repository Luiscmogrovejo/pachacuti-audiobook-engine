# Secrets template -- NEVER commit with real values.
# Generate secrets: openssl rand -hex 32
# Apply manually: kubectl apply -f k8s/secrets.yaml
#
# Application secrets -- used by Astro SSR server
apiVersion: v1
kind: Secret
metadata:
  name: pachacuti-app-secrets
  namespace: pachacuti
  labels:
    app: pachacuti
type: Opaque
stringData:
  # PostgreSQL connection
  database-url: "postgresql://pachacuti:CHANGE_ME@postgres.default.svc.cluster.local:5432/pachacuti"
  # Better Auth
  better-auth-secret: "CHANGE_ME_32_CHAR_RANDOM"
  better-auth-url: "https://<your-host>"
  # Audio JWT signing
  audio-token-secret: "CHANGE_ME_32_CHAR_RANDOM"
  # Resend magic link email
  resend-api-key: "re_CHANGE_ME"
  # Cloudflare Turnstile
  turnstile-site-key: "CHANGE_ME"
  turnstile-secret-key: "CHANGE_ME"
  # Stripe payment processing
  stripe-secret-key: "sk_live_CHANGE_ME"
  stripe-webhook-secret: "whsec_CHANGE_ME"
  stripe-price-id: "price_CHANGE_ME"
---
# Cloudflare Tunnel credentials -- used by cloudflared pod only
# Obtain from: ~/.cloudflared/<tunnel-uuid>.json
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-credentials
  namespace: pachacuti
  labels:
    app: pachacuti
    component: tunnel
type: Opaque
stringData:
  credentials.json: |
    {
      "AccountTag":   "CHANGE_ME_ACCOUNT_TAG",
      "TunnelSecret": "CHANGE_ME_TUNNEL_SECRET",
      "TunnelID":     "<cloudflare-tunnel-uuid>"
    }
